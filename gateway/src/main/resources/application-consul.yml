spring:
  application:
    name: gateway
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${HOSTNAME}
    gateway:
      server:
        webflux:
          routes:
            - id: image-scanner-service
              uri: lb://image-scanner-service
              predicates:
                - Path=/api/image-scanner/**

server:
  port: 8010

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  server:
    port: 8091